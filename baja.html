<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avisos por correo · Tomás Jarufe Urzúa</title>
  <meta name="robots" content="noindex">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: "Inter", system-ui, sans-serif;
      color: #c3c8cd;
      background: linear-gradient(160deg, #3c4044 0%, #2f3236 45%, #2a2d31 70%, #36393d 100%);
      text-align: center;
    }
    main { max-width: 420px; }
    h1 { color: #f1f3f5; font-size: 1.6rem; margin: 0 0 12px; }
    p { margin: 0 0 24px; line-height: 1.6; }
    button, a.volver {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    button {
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: linear-gradient(135deg, #5d6268 0%, #42464b 45%, #30343a 70%, #52575d 100%);
      box-shadow: 0 0 9px rgba(212, 175, 55, 0.4);
      color: #f1f3f5;
      margin-bottom: 16px;
    }
    button[disabled] { opacity: 0.6; cursor: default; }
    a.volver { border: 1px solid rgba(94, 234, 212, 0.55); background: rgba(45, 212, 191, 0.15); color: #5eead4; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1 id="titulo">¿Darte de baja?</h1>
    <p id="texto">Dejarás de recibir los correos de material nuevo.</p>
    <button id="boton" type="button">Sí, darme de baja</button><br>
    <a class="volver" href="/#material">Volver al material</a>
  </main>
  <script>
    // Los correos de avisos enlazan aqui (mismo dominio que el remitente, para no parecer spam).
    // Abrir la pagina no da de baja (los antivirus de correo abren todos los enlaces): hay que apretar el boton.
    (function () {
      const t = new URLSearchParams(location.search).get('t') || '';
      const titulo = document.getElementById('titulo');
      const texto = document.getElementById('texto');
      const boton = document.getElementById('boton');
      if (!t) { titulo.textContent = 'Enlace incompleto'; texto.textContent = 'Abre el enlace "Darme de baja" que viene al final de cualquier aviso.'; boton.hidden = true; return; }
      boton.addEventListener('click', async () => {
        boton.disabled = true;
        try {
          const r = await fetch('https://tomasjarufe.tomasjarufeurzua.workers.dev/api/baja?t=' + encodeURIComponent(t), { method: 'POST' });
          if (!r.ok) throw new Error(r.status);
          titulo.textContent = 'Te diste de baja';
          texto.textContent = 'Ya no recibirás más correos de avisos de material. Tu correo fue borrado de la lista.';
          boton.hidden = true;
        } catch (e) {
          texto.textContent = 'No se pudo completar. Intenta de nuevo en unos minutos.';
          boton.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
